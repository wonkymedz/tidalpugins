name: "[master] Release"

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - ".vscode/**"
  workflow_dispatch:

# Needed so the release can be created with the repository's GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  Build:
    uses: ./.github/workflows/build.yml

  Release:
    name: Release latest on GitHub
    needs: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: luna-artifacts
          path: ./dist/

      # Publishes dist/** as the "latest" release, giving TidaLuna a stable store URL:
      # https://github.com/<owner>/<repo>/releases/download/latest/store.json
      # (softprops/action-gh-release is used instead of the archived
      # marvinpinto/action-automatic-releases that the template ships with.)
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          make_latest: true
          prerelease: false
          files: ./dist/**
